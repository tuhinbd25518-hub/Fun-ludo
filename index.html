<!DOCTYPE html>\n<html lang="en">\n<head>\n    <meta charset="UTF-8">\n    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n    <title>Ludo Game</title>\n    <style>\n        body { display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f0f0f0; }\n        #game { width: 600px; height: 600px; border: 5px solid #333; position: relative; }\n        .player { position: absolute; width: 50px; height: 50px; border-radius: 50%; }\n        #player1 { background-color: red; }\n        #player2 { background-color: blue; }\n        #player3 { background-color: green; }\n        #player4 { background-color: yellow; }\n    </style>\n</head>\n<body>\n    <div id="game">\n        <div id="player1" class="player" style="top: 0; left: 0;"></div>\n        <div id="player2" class="player" style="top: 0; right: 0;"></div>\n        <div id="player3" class="player" style="bottom: 0; left: 0;"></div>\n        <div id="player4" class="player" style="bottom: 0; right: 0;"></div>\n    </div>\n    <script>\n        // Game logic goes here\n        const players = [document.getElementById('player1'), document.getElementById('player2'), document.getElementById('player3'), document.getElementById('player4')];\n\n        function movePlayer(playerIndex, steps) {\n            // Simulated move logic\n            console.log('Moving player:', playerIndex, 'Steps:', steps);\n        }\n\n        function rollDice() {\n            return Math.floor(Math.random() * 6) + 1;\n        }\n\n        // Example of usage\n        let currentPlayer = 0;\n        function turn() {\n            const steps = rollDice();\n            movePlayer(currentPlayer, steps);\n            currentPlayer = (currentPlayer + 1) % 4;\n        }\n\n        // Simulate turns\n        setInterval(turn, 2000);\n    </script>\n</body>\n</html>
